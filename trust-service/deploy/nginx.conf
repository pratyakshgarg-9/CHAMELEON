# mTLS termination for trust-service. Mirrors node-agent/deploy/nginx.conf
# — see that file's comment for the full rationale. Only used when this
# service is run with MTLS_ENABLED=true, HOST=127.0.0.1, PORT=8201 (see
# ../../deploy/edge1-services/docker-compose.yml).

worker_processes 1;
events { worker_connections 128; }

http {
    # See node-agent/deploy/nginx.conf's comment: $ssl_client_s_dn_cn
    # isn't recognized on every nginx build, so extract CN from
    # $ssl_client_s_dn instead.
    map $ssl_client_s_dn $ssl_client_cn {
        default "";
        "~CN=(?<CN>.*)$" $CN;
    }

    server {
        listen 8200 ssl;

        ssl_certificate     /certs/node.crt;
        ssl_certificate_key /certs/node.key;
        ssl_client_certificate /ca/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location / {
            proxy_set_header X-SSL-Client-CN $ssl_client_cn;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_pass http://127.0.0.1:8201;
        }
    }
}
