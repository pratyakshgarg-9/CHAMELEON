# mTLS termination for node-agent. Only used when the "mtls" compose
# profile is active (see docker-compose.yml) — node-agent itself must be
# bound to 127.0.0.1:8001 (set HOST=127.0.0.1, PORT=8001 in ../.env) so
# this is the only thing reachable on the node's real port 8000.
#
# nginx does the mTLS handshake (rejects anything not signed by our CA at
# the TLS layer, before any app code runs) and forwards the verified
# client cert's CN as X-SSL-Client-CN — that's what
# app/deps.py:require_cn_matches checks against the node_id a caller
# claims in its request body. Any client-supplied X-SSL-Client-CN is
# stripped first so it can't be spoofed by a caller who skips nginx.

worker_processes 1;
events { worker_connections 128; }

http {
    # $ssl_client_s_dn_cn isn't available on every nginx build (hit
    # "unknown variable" on nginx:alpine in practice) — extract the CN
    # from $ssl_client_s_dn instead, which is universally available. Our
    # certs (scripts/issue_certs.py) only ever set a bare CN as the whole
    # subject, so this simple suffix match is exact, not a heuristic.
    map $ssl_client_s_dn $ssl_client_cn {
        default "";
        "~CN=(?<CN>.*)$" $CN;
    }

    server {
        listen 8000 ssl;

        # /migrate-out transfers a full container image (and optionally a
        # volume tarball) as a multipart upload to a peer's /migrate-in —
        # nginx's 1m default would reject any real image. Matches the
        # migration protocol's own MIGRATE_TIMEOUT generosity
        # (app/clients.py) rather than picking an arbitrary cap.
        client_max_body_size 0;

        ssl_certificate     /certs/node.crt;
        ssl_certificate_key /certs/node.key;
        ssl_client_certificate /ca/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location / {
            # proxy_set_header always overwrites the outgoing header with
            # this value — a client-supplied X-SSL-Client-CN never passes
            # through, so this can't be spoofed by skipping the handshake.
            proxy_set_header X-SSL-Client-CN $ssl_client_cn;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_pass http://127.0.0.1:8001;
        }
    }
}
